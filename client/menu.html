  <script>
    /* Страховка: страница обязана показаться, даже если js/app.js
       не догрузился, был вырезан прокси/провайдером или упал с ошибкой.
       Без неё заставка остаётся висеть, а все .reveal — прозрачными. */
    (function (d) {
      var h = d.documentElement;
      h.className = h.className.replace(/\bno-js\b/, 'js');
      window.__brioFallback = function () {
        if (h.className.indexOf('js-failed') > -1) return;
        h.className = h.className.replace(/\s*intro-lock/, '') + ' js-failed';
        window.__brioSkipIntro = true;
        try { d.body.style.overflow = ''; d.body.style.paddingRight = ''; } catch (e) {}
        /* Видео первого экрана без автозапуска — его включает app.js после
           заставки. Раз скрипта нет, включаем сами (кроме «уменьшить движение»). */
        try {
          var hv = d.getElementById('heroVideo');
          var calm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
          if (hv && !calm) { var pr = hv.play(); if (pr && pr.catch) pr.catch(function () {}); }
        } catch (e) {}
      };
      setTimeout(function () {
        if (!window.__brioReady) window.__brioFallback();
      }, 4000);

    })(document);
  </script>
